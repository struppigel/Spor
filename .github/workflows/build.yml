name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create the release for a tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # tag v0.2.0 -> version 0.2.0; other builds keep the version from Spor.csproj
      - name: Build
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { "-p:Version=$($env:GITHUB_REF_NAME.TrimStart('v'))" } else { "" }
          dotnet build Spor.csproj -c Release $ver

      - name: Hash
        shell: pwsh
        run: |
          $h = (Get-FileHash bin\Release\net48\Spor.exe -Algorithm SHA256).Hash
          "$h  Spor.exe" | Out-File -Encoding ascii bin\Release\net48\Spor.exe.sha256
          "SHA256: $h" | Out-File -Encoding utf8 release-notes.md
          Write-Host "SHA256 $h"

      - uses: actions/upload-artifact@v4
        with:
          name: Spor
          path: |
            bin/Release/net48/Spor.exe
            bin/Release/net48/Spor.exe.sha256

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Release/net48/Spor.exe
            bin/Release/net48/Spor.exe.sha256
          body_path: release-notes.md